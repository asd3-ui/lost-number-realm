name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate game JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim().length > 0);
          if (scripts.length === 0) throw new Error('No inline JavaScript found in index.html');
          for (const source of scripts) new Function(source);
          console.log(`Validated ${scripts.length} inline JavaScript block(s).`);
          NODE

      - name: Build web assets
        run: |
          npm run build
          test -s www/index.html
          echo "Web assets prepared."

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform directory already exists."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          test -f android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LostNumberRealm-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
